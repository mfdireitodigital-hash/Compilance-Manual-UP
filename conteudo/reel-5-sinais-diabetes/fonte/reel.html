  .paper{position:relative;}

<body>
<div id="stage">
  <svg class="grain" width="1080" height="1920">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/></filter>
    <rect width="1080" height="1920" filter="url(#n)"/>

<script>
/* ---------- deterministic PRNG for torn paper edges ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* jagged "torn paper" polygon for a w x h panel (padding 14 built in) */
function paperSVG(w,h,color,seed,jag){
  jag=jag||7;
  const rnd=mulberry32(seed), W=w+28, H=h+28, P=14;
  const pts=[]; const step=34;
  function edge(x0,y0,x1,y1){
    const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy), n=Math.max(2,Math.round(len/step));
    for(let i=0;i<n;i++){
      const t=i/n, nx=-dy/len, ny=dx/len, off=(rnd()*2-1)*jag;
      pts.push([x0+dx*t+nx*off, y0+dy*t+ny*off]);
    }
  }
  edge(P,P,W-P,P); edge(W-P,P,W-P,H-P); edge(W-P,H-P,P,H-P); edge(P,H-P,P,P);
  const d=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  return `<svg class="bg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polygon points="${d}" fill="${color}"/></svg>`;
}

/* ---------- element factory ---------- */
const stage=document.getElementById('stage');
function el(html,style){
  const d=document.createElement('div');
  d.className='el'; d.innerHTML=html;
  Object.assign(d.style,style);
  stage.appendChild(d); return d;
}
function card(w,h,color,seed,innerHTML,style,shadow){
  return el(`<div class="paper ${shadow||'sh-lg'}" style="width:${w}px;height:${h}px">${paperSVG(w,h,color,seed)}<div class="inner" style="width:100%;height:100%">${innerHTML}</div></div>`,style);
}

/* ---------- tween engine (deterministic, driven by __seek) ---------- */
const tweens=[];
const E={
  linear:t=>t,
  outCubic:t=>1-Math.pow(1-t,3),
  inCubic:t=>t*t*t,
  outBack:t=>{const c=2.0;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
  inBack:t=>{const c=1.7;return (c+1)*t*t*t-c*t*t}
};
const byEl=new Map();
function tw(elm,t0,t1,from,to,ease){
  const k={el:elm,t0,t1,from,to,ease:ease||'outCubic'};
  tweens.push(k);
  if(!byEl.has(elm))byEl.set(elm,[]);
  byEl.get(elm).push(k);
}
function seek(ms){
  for(const [elm,list] of byEl){
    const s={x:0,y:0,r:0,sc:1,o:0};
    const started=list.filter(k=>ms>=k.t0).sort((a,b)=>a.t0-b.t0);
    if(started.length===0){
      // antes do primeiro tween: aplica o estado inicial dele
      const f=list.slice().sort((a,b)=>a.t0-b.t0)[0];
      for(const prop of ['x','y','r','sc','o']){
        if(f.from[prop]!==undefined)s[prop]=f.from[prop];
      }
    }else{
      for(const k of started){
        const p=ms>=k.t1?1:(ms-k.t0)/(k.t1-k.t0);
        const e=E[k.ease](p);
        for(const prop of ['x','y','r','sc','o']){
          if(k.from[prop]!==undefined){s[prop]=k.from[prop]+(k.to[prop]-k.from[prop])*e}
        }
      }
    }
    elm.style.transform=`translate(${s.x}px,${s.y}px) rotate(${s.r}deg) scale(${s.sc})`;
    elm.style.opacity=s.o;
  }
}
window.__seek=seek;

/* enter = drop in with rotation settle; exit = slide away */
function enter(elm,t0,rot,fromY,dur){
  tw(elm,t0,t0+(dur||620),{y:fromY===undefined?-900:fromY,r:(rot||0)-16,o:0,x:0,sc:1},{y:0,r:rot||0,o:1,x:0,sc:1},'outBack');
}
function exit(elm,t0,dir){
  tw(elm,t0,t0+420,{},{y:dir==='up'?-1100:1300,r:10,o:0},'inBack');
  // '{}' from: carry current — engine needs explicit from; patch below
}
/* engine needs explicit from-values; wrap exit with known rest state */
function exitFrom(elm,t0,rot,dir){
  tw(elm,t0,t0+430,{y:0,r:rot||0,o:1},{y:dir==='up'?-1200:1350,r:(rot||0)+12,o:0},'inCubic');
}

/* ================================================================

function dotsRow(active,seedBase){

    s+=`<div style="width:34px;height:34px;border-radius:50%;background:${i===active?BLUE2:'rgba(13,71,161,.18)'};border:4px solid ${i===active?BLUE:'rgba(13,71,161,.30)'}"></div>`;

  return s+'</div>';

function signScene(idx,t0,titleHTML,subText,iconHTML,seed){

  const dots=el(`<div style="width:400px;height:60px">${dotsRow(X,seed)}</div>`,{left:'340px',top:'268px'});
  const num=card(150,150,BLUE2,seed+2,
    `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:96px;font-weight:800;color:#fff">${X+1}</div>`,
    {left:'120px',top:'390px'});
  const icon=card(720,720,CREAM,seed+3,
    `<div style="display:flex;align-items:center;justify-content:center;height:100%">${iconHTML}</div>`,
    {left:'180px',top:'560px'});
  const title=card(880,190,BLUE,seed+4,
    `<div style="display:flex;align-items:center;justify-content:center;height:100%;text-align:center;font-size:66px;font-weight:800;color:#fff;line-height:1.15;padding:0 30px;box-sizing:border-box">${titleHTML}</div>`,
    {left:'100px',top:'1350px'});
  const sub=card(820,120,WHITE,seed+5,
    `<div style="display:flex;align-items:center;justify-content:center;height:100%;text-align:center;font-size:38px;font-weight:500;color:${INK};line-height:1.3;padding:0 34px;box-sizing:border-box">${subText}</div>`,
    {left:'130px',top:'1590px'},'sh-md');
  const brand=el(`<div style="width:1080px;text-align:center;font-size:28px;font-weight:700;letter-spacing:8px;color:rgba(13,71,161,.55)">UNIVERSE PHARMA</div>`,{left:'0px',top:'1790px'});

  enter(head,T+60,-1,-500);
  tw(dots,T+140,T+560,{y:-400,o:0,x:0,r:0,sc:1},{y:0,o:1,x:0,r:0,sc:1},'outCubic');
  enter(num,T+220,-8,-700);
  enter(icon,T+330,1.4,-1100,720);
  enter(title,T+560,-1.5,1500);
  enter(sub,T+700,1.2,1500);
  tw(brand,T+700,T+1100,{o:0,y:60,x:0,r:0,sc:1},{o:1,y:0,x:0,r:0,sc:1});

  const OUT=T+3980;
  exitFrom(head,OUT,-1,'up');
  tw(dots,OUT,OUT+400,{y:0,o:1},{y:-900,o:0},'inCubic');
  exitFrom(num,OUT,-8,'up');
  exitFrom(icon,OUT+20,1.4,'down');
  exitFrom(title,OUT,-1.5,'down');
  exitFrom(sub,OUT,1.2,'down');
  tw(brand,OUT,OUT+380,{o:1,y:0},{o:0,y:80},'inCubic');
}
